<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Markdown → Image</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><b>Markdown → Image</b></div>

    <div class="toolbar desktop-only">
      <div class="field">
        <label for="preset">Preset</label>
        <select id="preset" class="sel" title="Preset sets width and text size; fonts are kept"></select>
      </div>
      <div class="field">
        <label for="width">Width</label>
        <input id="width" class="num" type="number" min="240" max="4320" step="2" />
        <span class="unit">px</span>
      </div>
      <div class="field">
        <label for="fontsize">Size</label>
        <input id="fontsize" class="num" type="number" min="12" max="240" step="1" />
        <span class="unit">px</span>
      </div>
    </div>

    <button id="fontBtnTop" class="font-btn desktop-only" type="button">
      <span class="name" id="fontNameTop"></span>
      <span class="chev">▾</span>
    </button>

    <div class="spacer"></div>
    <button id="copyPngBtn" class="ghost" type="button">Copy PNG</button>
    <button id="exportBtn" class="primary" type="button">Export PNG</button>
  </header>

  <div class="workspace">
    <section class="pane editor" id="editorPane">
      <div class="pane-head">
        <b>Markdown</b>
      </div>
      <textarea id="mdInput" spellcheck="false" aria-label="Markdown input"></textarea>
    </section>

    <section class="pane stage" id="stagePane">
      <div class="stage-bar">
        <span class="metrics" id="metrics"></span>
        <span class="spacer"></span>
        <span class="warn" id="cjkWarn" hidden>Selected fonts have no Chinese glyphs — CJK falls back to the system font</span>
      </div>
      <div class="stage-scroll" id="stageScroll">
        <div class="canvas-scaler" id="canvasScaler">
          <div class="canvas-wrap" id="canvasWrap">
            <div class="md" id="canvas"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="bottombar">
    <div class="urlline desktop-only">
      <label>Share link</label>
      <input id="urlOut" readonly spellcheck="false" aria-label="Share link" />
      <button id="copyBtn" class="ghost" type="button">Copy</button>
    </div>
    <nav class="mobile-tabs mobile-only">
      <button id="tabEditor" type="button">Edit</button>
      <button id="tabPreview" type="button" class="active">Preview</button>
      <button id="openParams" type="button">Params</button>
    </nav>
  </footer>

  <div class="scrim" id="scrim"></div>

  <section class="sheet params-sheet" id="paramsSheet">
    <div class="sheet-head">
      <b>Parameters</b><span class="spacer"></span>
      <button class="sheet-close" id="paramsClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="params-body">
      <div class="param-row">
        <label>Preset</label>
        <div class="chips" id="presetChips"></div>
      </div>
      <div class="param-row">
        <label>Width</label>
        <button class="chip step" id="wMinus" type="button">−</button>
        <input id="widthM" class="num" type="number" min="240" max="4320" step="2" aria-label="Width" />
        <button class="chip step" id="wPlus" type="button">+</button>
        <span class="unit">px</span>
      </div>
      <div class="param-row">
        <label>Size</label>
        <button class="chip step" id="fsMinus" type="button">−</button>
        <input id="fontsizeM" class="num" type="number" min="12" max="240" step="1" aria-label="Text size" />
        <button class="chip step" id="fsPlus" type="button">+</button>
        <span class="unit">px</span>
      </div>
      <div class="param-row">
        <label>Fonts</label>
        <button id="fontBtnM" class="font-btn" type="button">
          <span class="name" id="fontNameM"></span><span class="chev">▾</span>
        </button>
      </div>
      <div class="param-row">
        <label>Link</label>
        <input id="urlOutM" class="url-mini" readonly spellcheck="false" aria-label="Share link" />
        <button id="copyBtnM" class="ghost" type="button">Copy</button>
      </div>
    </div>
  </section>

  <section class="sheet font-panel" id="fontPanel">
    <div class="sheet-head">
      <b>Fonts</b>
      <span class="spacer"></span>
      <span id="fontCount" class="muted small"></span>
      <button class="sheet-close" id="fontClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="search">
      <input id="fontSearch" type="text" placeholder="Search fonts by name, style, category — multi-select" autocomplete="off" />
    </div>
    <div class="chips-wrap">
      <div class="chips-row"><span class="chip-label">Category</span><div class="chips" id="clsChips"></div></div>
      <div class="chips-row"><span class="chip-label">Style</span><div class="chips" id="groupTabs"></div></div>
      <div class="chips-row"><span class="chip-label"></span><div class="chips" id="tagChips"></div></div>
      <div class="chips-row"><span class="chip-label">Props</span><div class="chips" id="flagChips"></div></div>
    </div>
    <div class="font-count">
      <span id="fontSummary">Loading font catalog…</span>
      <button id="clearFilters" class="link-btn" type="button" hidden>Clear filters</button>
    </div>
    <div class="selected-bar" id="selectedBar"></div>
    <div class="font-scroll" id="fontScroll">
      <div class="font-spacer" id="fontSpacer"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
